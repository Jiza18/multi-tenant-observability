name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make generate
      - name: Fail if tenants.yaml and generated files disagree
        run: git diff --exit-code || (echo "::error::Run 'make generate' and commit the result" && exit 1)

  vendored:
    name: Vendored upstream content matches its pinned version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/vendor-upstream.sh
      - name: Fail if vendored files differ from upstream
        run: git diff --exit-code || (echo "::error::Run 'make vendor' and commit the result" && exit 1)

  rules:
    name: Alerting rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-rules

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make validate

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable scripts/*.sh

  e2e:
    name: End-to-end (Compose demo)
    runs-on: ubuntu-latest
    needs: [go, rules]
    steps:
      - uses: actions/checkout@v7
      - name: Start the demo
        run: make demo
      - name: Smoke test
        run: make smoke-test
      - name: Logs on failure
        if: failure()
        run: docker compose --project-directory deploy/compose --profile demo logs --tail=100
