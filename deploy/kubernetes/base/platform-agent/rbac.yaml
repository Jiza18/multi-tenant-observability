apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-agent
---
# Pod discovery limited to this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-agent
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-agent
subjects:
  - kind: ServiceAccount
    name: platform-agent
