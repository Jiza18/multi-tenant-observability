apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
    spec:
      serviceAccountName: platform-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: CLUSTER_NAME
              value: observability # set per overlay
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: platform-agent-config
        - name: data
          emptyDir: {}
