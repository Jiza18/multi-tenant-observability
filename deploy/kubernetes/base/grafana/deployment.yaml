# Grafana is stateless here: datasources and dashboards are provisioned from
# Git. Users and preferences go to SQLite on an emptyDir by default; the
# production overlay points Grafana to PostgreSQL instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/platform/alerts-console.json
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: provisioning
          configMap:
            name: grafana-provisioning
        # Rebuilds the folder layout of grafana/dashboards from one ConfigMap
        # per dashboard.
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: dashboard-alerts-console
                  items: [{key: alerts-console.json, path: platform/alerts-console.json}]
              - configMap:
                  name: dashboard-tenants-overview
                  items: [{key: tenants-overview.json, path: platform/tenants-overview.json}]
              - configMap:
                  name: dashboard-node-exporter-full
                  items: [{key: node-exporter-full.json, path: hosts/node-exporter-full.json}]
              - configMap:
                  name: dashboard-mimir-overview
                  items: [{key: mimir-overview.json, path: mimir/mimir-overview.json}]
              - configMap:
                  name: dashboard-mimir-writes
                  items: [{key: mimir-writes.json, path: mimir/mimir-writes.json}]
              - configMap:
                  name: dashboard-mimir-reads
                  items: [{key: mimir-reads.json, path: mimir/mimir-reads.json}]
              - configMap:
                  name: dashboard-mimir-queries
                  items: [{key: mimir-queries.json, path: mimir/mimir-queries.json}]
              - configMap:
                  name: dashboard-mimir-tenants
                  items: [{key: mimir-tenants.json, path: mimir/mimir-tenants.json}]
              - configMap:
                  name: dashboard-mimir-top-tenants
                  items: [{key: mimir-top-tenants.json, path: mimir/mimir-top-tenants.json}]
              - configMap:
                  name: dashboard-mimir-ruler
                  items: [{key: mimir-ruler.json, path: mimir/mimir-ruler.json}]
              - configMap:
                  name: dashboard-mimir-alertmanager
                  items: [{key: mimir-alertmanager.json, path: mimir/mimir-alertmanager.json}]
              - configMap:
                  name: dashboard-mimir-object-store
                  items: [{key: mimir-object-store.json, path: mimir/mimir-object-store.json}]
              - configMap:
                  name: dashboard-mimir-compactor
                  items: [{key: mimir-compactor.json, path: mimir/mimir-compactor.json}]
