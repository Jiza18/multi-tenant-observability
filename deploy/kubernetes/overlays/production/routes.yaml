# Public endpoints through Gateway API. The parent Gateway (TLS termination)
# is owned by the cluster's networking setup, not by this stack.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-gateway
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - metrics.example.com
  rules:
    - backendRefs:
        - name: tenant-gateway
          port: 8080
      timeouts:
        request: 300s # long-range queries
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - grafana.example.com
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
