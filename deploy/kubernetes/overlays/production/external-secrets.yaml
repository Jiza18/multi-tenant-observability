# Every secret comes from the external store; nothing sensitive lives in Git.
# Adjust `secretStoreRef` and the remote keys to your store (Vault, AWS
# Secrets Manager, Azure Key Vault, ...).

# Bucket and credentials for Mimir: S3_ENDPOINT, S3_BUCKET,
# S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-object-storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: mimir-object-storage
  dataFrom:
    - extract:
        key: observability/mimir-object-storage
---
# Gateway token file (tokens.yaml with SHA-256 digests only, see
# docs/onboarding.md). The gateway reloads it without restarting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-gateway-tokens
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: tenant-gateway-tokens
  data:
    - secretKey: tokens.yaml
      remoteRef:
        key: observability/tenant-gateway-tokens
        property: tokens.yaml
---
# Break-glass local admin; day-to-day access goes through SSO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: grafana-admin
  data:
    - secretKey: password
      remoteRef:
        key: observability/grafana-admin
        property: password
---
# Microsoft Entra ID app registration:
# GF_AUTH_AZUREAD_CLIENT_ID, GF_AUTH_AZUREAD_CLIENT_SECRET,
# GF_AUTH_AZUREAD_AUTH_URL and GF_AUTH_AZUREAD_TOKEN_URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: grafana-sso
  dataFrom:
    - extract:
        key: observability/grafana-sso
---
# PostgreSQL for Grafana users and preferences:
# GF_DATABASE_HOST, GF_DATABASE_NAME, GF_DATABASE_USER and GF_DATABASE_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform
  target:
    name: grafana-database
  dataFrom:
    - extract:
        key: observability/grafana-database
