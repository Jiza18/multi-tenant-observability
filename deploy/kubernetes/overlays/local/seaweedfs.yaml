# Single-node S3-compatible storage for local clusters only. Production uses
# a managed bucket (see overlays/production).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=256
          ports:
            - name: s3
              containerPort: 8333
            - name: master
              containerPort: 9333
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
          # Mimir does not create buckets.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    until echo s3.bucket.list | weed shell -master=localhost:9333 >/dev/null 2>&1; do sleep 2; done
                    echo s3.bucket.list | weed shell -master=localhost:9333 | grep -qw mimir \
                      || echo "s3.bucket.create -name mimir" | weed shell -master=localhost:9333
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: identities
              mountPath: /etc/seaweedfs
      volumes:
        - name: data
          emptyDir: {}
        - name: identities
          secret:
            secretName: seaweedfs-s3-identities
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
