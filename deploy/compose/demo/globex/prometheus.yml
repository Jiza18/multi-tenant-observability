# Globex runs its own Prometheus and evaluates its rules locally (as with
# kube-prometheus-stack). It only shares its alerts with the platform:
#   - alerts are pushed to its tenant's Alertmanager for notification, and
#   - ALERTS / ALERTS_FOR_STATE series are remote-written for the console.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: globex-eu-west-1

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

alerting:
  alertmanagers:
    - api_version: v2
      path_prefix: /alertmanager
      static_configs:
        - targets: [tenant-gateway:8080]
      authorization:
        credentials_file: /run/secrets/gateway-token

remote_write:
  - url: http://tenant-gateway:8080/api/v1/push
    authorization:
      credentials_file: /run/secrets/gateway-token
    write_relabel_configs:
      - source_labels: [__name__]
        regex: ALERTS|ALERTS_FOR_STATE
        action: keep
