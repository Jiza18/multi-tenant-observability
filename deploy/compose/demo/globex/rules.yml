# Simulated alerts so the demo has something to show. Real tenants ship the
# rules of kube-prometheus-stack or their own.
groups:
  - name: demo
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: Always-firing alert that proves the alerting pipeline works.

      - alert: PaymentsQueueBacklog
        expr: vector(4200)
        for: 1m
        labels:
          severity: critical
          namespace: payments
        annotations:
          summary: "{{ $value }} payments are waiting to be processed (simulated)."

      - alert: CheckoutLatencyHigh
        expr: vector(1.8)
        for: 1m
        labels:
          severity: warning
          namespace: checkout
        annotations:
          summary: "Checkout p99 latency is {{ $value }}s (simulated)."
