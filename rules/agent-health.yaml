groups:
  - name: agent-health
    rules:
      - alert: TenantNoData
        expr: absent_over_time(up[15m])
        labels:
          severity: critical
        annotations:
          summary: No metrics received from this tenant for 15 minutes.
          description: >-
            The tenant's agents stopped shipping metrics. Check that the agent is
            running, that it can reach the gateway and that its token is valid.

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }}/{{ $labels.instance }} is down."
          description: "The agent has not been able to scrape {{ $labels.instance }} for 10 minutes."
