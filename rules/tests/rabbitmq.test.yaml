rule_files:
  - ../rabbitmq.yaml

evaluation_interval: 1m

tests:
  # The previous rule (`redelivered_total > 0`) fired forever after a single
  # redelivery. The rate-based rule must stay quiet once the counter is flat.
  - name: a past burst of redeliveries does not keep the alert firing
    interval: 1m
    input_series:
      - series: 'rabbitmq_channel_messages_redelivered_total{instance="mq-1", job="rabbitmq"}'
        values: '0 50 50x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: RabbitMQHighRedeliveryRate
        exp_alerts: []

  - name: sustained redeliveries fire
    interval: 1m
    input_series:
      - series: 'rabbitmq_channel_messages_redelivered_total{instance="mq-1", job="rabbitmq"}'
        values: '0+120x30'  # 2 messages/s
    alert_rule_test:
      - eval_time: 20m
        alertname: RabbitMQHighRedeliveryRate
        exp_alerts:
          - exp_labels: {severity: warning, instance: mq-1, job: rabbitmq}
            exp_annotations:
              summary: "RabbitMQ mq-1 is redelivering 2 messages/s."
              description: "Consumers keep rejecting or failing to ack messages. Look for poison messages or crashing consumers."
